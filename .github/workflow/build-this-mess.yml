name: Build zcharge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            unzip \
            wget

      - name: Install Android NDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd "$HOME/android-sdk"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools-linux-11076708_latest.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.3.11579264"

          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Prepare Android compiler
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p "$HOME/android-prefix/aarch64-linux-android/lib"

          # Makefile expects this exact library path.
          cp "$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             "$HOME/android-prefix/aarch64-linux-android/lib/"

          # Make the Android cross-compiler available as "g++",
          # because the repository Makefile hardcodes CC = g++.
          ln -sf \
            "$TOOLCHAIN/bin/aarch64-linux-android24-clang++" \
            "$HOME/android-prefix/g++"

          echo "$HOME/android-prefix" >> "$GITHUB_PATH"
          echo "PREFIX=$HOME/android-prefix" >> "$GITHUB_ENV"

          echo "Compiler:"
          "$HOME/android-prefix/g++" --version

          echo
          echo "PREFIX:"
          echo "$PREFIX"

          echo
          echo "libc++:"
          ls -l "$PREFIX/aarch64-linux-android/lib/libc++_shared.so"

      - name: Build zcharge
        run: |
          make clean
          make

      - name: Verify binary
        run: |
          echo "Binary:"
          file system/bin/zcharge

          echo
          echo "ELF header:"
          readelf -h system/bin/zcharge | grep -E 'Class|Machine'

          echo
          echo "zcharge string:"
          strings system/bin/zcharge | grep -F "Waiting" || true

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: zcharge-binary
          path: system/bin/zcharge
          if-no-files-found: error
          retention-days: 14
